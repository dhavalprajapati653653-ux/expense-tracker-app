<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Expense Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e1b4b);
  color: white;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 15px;
}

.header {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

.card {
  background: rgba(255,255,255,0.06);
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 12px;
  backdrop-filter: blur(10px);
}

.balance {
  font-size: 28px;
  text-align: center;
}

.row {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #6366f1;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 8px;
  border-bottom: 1px solid #444;
  font-size: 14px;
}

.delete {
  background: red;
  border: none;
  color: white;
  padding: 4px 6px;
  border-radius: 6px;
}

.income { color: lightgreen; }
.expense { color: #ff6b6b; }
</style>
</head>

<body>

<div class="container">

<div class="header">💰 Pro Expense Tracker</div>

<div class="card">
  <div class="balance">₹<span id="balance">0</span></div>

  <div class="row">
    <div class="income">Income: ₹<span id="income">0</span></div>
    <div class="expense">Expense: ₹<span id="expense">0</span></div>
  </div>
</div>

<div class="card">
  <input id="text" placeholder="Enter description">
  <select id="category">
    <option>Food</option>
    <option>Petrol</option>
    <option>Rent</option>
    <option>Other</option>
  </select>
  <input id="amount" type="number" placeholder="Amount (+income / -expense)">
  <button onclick="addTransaction()">Add Transaction</button>
</div>

<div class="card">
  <h3>📊 History</h3>
  <table>
    <thead>
      <tr>
        <th>Text</th>
        <th>Cat</th>
        <th>Amt</th>
        <th>Del</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</div>

</div>

<script>
let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

function updateUI() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let balance = 0;
  let income = 0;
  let expense = 0;

  transactions.forEach((t, index) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${t.text}</td>
      <td>${t.category}</td>
      <td>${t.amount}</td>
      <td><button class="delete" onclick="removeTransaction(${index})">X</button></td>
    `;

    list.appendChild(tr);

    balance += t.amount;
    if (t.amount > 0) income += t.amount;
    else expense += t.amount;
  });

  document.getElementById("balance").innerText = balance;
  document.getElementById("income").innerText = income;
  document.getElementById("expense").innerText = Math.abs(expense);

  localStorage.setItem("transactions", JSON.stringify(transactions));
}

function addTransaction() {
  const text = document.getElementById("text").value;
  const category = document.getElementById("category").value;
  const amount = Number(document.getElementById("amount").value);

  if (!text || !amount) return;

  transactions.push({ text, category, amount });

  document.getElementById("text").value = "";
  document.getElementById("amount").value = "";

  updateUI();
}

function removeTransaction(index) {
  transactions.splice(index, 1);
  updateUI();
}

updateUI();
</script>

</body>
</html>
