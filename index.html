<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker</title>
</head>
<body>

<h2>My Daily Expenses</h2>

<h3>Petrol: $<span id="petrolTotal">50</span></h3>

<input type="number" id="amount" placeholder="Enter amount">
<button onclick="addPetrol()">+ Add Amount</button>

<script>
let petrol = 50;

function addPetrol() {
    let amount = Number(document.getElementById("amount").value);
    petrol += amount;
    document.getElementById("petrolTotal").innerText = petrol;
    document.getElementById("amount").value = "";
}
</script>

</body>
</html>
